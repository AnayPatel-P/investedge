[project]
name = "investedge"
version = "0.1.0"
description = "InvestEdge backend: S&P 500 data pipeline, time-series forecasts, and API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.50",
    "duckdb>=1.1",
    "pyarrow>=17",
    "statsforecast>=1.7",
    "prophet>=1.1.6",
    "arch>=7.0",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "requests>=2.32",
    "lxml>=5.3",
    "anthropic>=2.9.0",
]

[project.scripts]
investedge = "investedge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investedge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prompt text and tool descriptions read better unwrapped.
"src/investedge/ai/*" = ["E501"]
"evals/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
