<!doctype html>
<!-- THROWAWAY Phase 1 walking-skeleton page. Replaced by the original-ui frontend in Phase 4. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InvestEdge skeleton</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
    #chart { width: 100%; height: 520px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .legend span { margin-right: 14px; font-size: 13px; }
    .note { font-size: 12px; color: #666; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="row">
    <strong>InvestEdge · skeleton</strong>
    <select id="ticker" aria-label="Ticker"></select>
    <label><input type="checkbox" id="m-arima" checked /> ARIMA</label>
    <label><input type="checkbox" id="m-naive" /> Naive baseline</label>
  </div>
  <div id="chart"></div>
  <div class="legend" id="legend"></div>
  <p class="note">Educational demo, not financial advice. Bands show 80% / 95% forecast intervals.</p>

<script>
const COLORS = { arima: "#2563eb", naive: "#9333ea" };
const chart = LightweightCharts.createChart(document.getElementById("chart"), {
  autoSize: true,
  layout: { background: { color: "#fff" }, textColor: "#222" },
  rightPriceScale: { borderVisible: false },
  timeScale: { borderVisible: false },
});
const candles = chart.addCandlestickSeries({
  upColor: "#16a34a", downColor: "#dc2626", wickUpColor: "#16a34a", wickDownColor: "#dc2626",
  borderUpColor: "#16a34a", borderDownColor: "#dc2626",
});
let overlay = [];

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  return r.json();
}

async function load(sym) {
  const [prices, fc] = await Promise.all([
    getJSON(`/api/stocks/${sym}/prices`),
    getJSON(`/api/stocks/${sym}/forecasts`),
  ]);
  candles.setData(prices.map(p => ({ time: p.date, open: p.open, high: p.high, low: p.low, close: p.close })));
  overlay.forEach(s => chart.removeSeries(s));
  overlay = [];
  const legend = [];
  for (const model of ["naive", "arima"]) {
    if (!document.getElementById(`m-${model}`).checked || !fc[model]) continue;
    const c = COLORS[model];
    const line = (key, style, width) => {
      const s = chart.addLineSeries({ color: c, lineWidth: width, lineStyle: style, priceLineVisible: false, lastValueVisible: false });
      s.setData(fc[model].map(f => ({ time: f.date, value: f[key] })));
      overlay.push(s);
    };
    line("mean", 0, 2);
    line("lo_80", 2, 1); line("hi_80", 2, 1);
    line("lo_95", 3, 1); line("hi_95", 3, 1);
    const end = fc[model][fc[model].length - 1];
    legend.push(`<span style="color:${c}">${model}: ${end.mean.toFixed(2)} (95%: ${end.lo_95.toFixed(2)}–${end.hi_95.toFixed(2)}) on ${end.date}</span>`);
  }
  document.getElementById("legend").innerHTML = legend.join("");
  const last = prices[prices.length - 1].date;
  chart.timeScale().setVisibleRange({ from: prices[Math.max(0, prices.length - 180)].date, to: fc.arima ? fc.arima[fc.arima.length - 1].date : last });
}

(async () => {
  const tickers = await getJSON("/api/tickers");
  const sel = document.getElementById("ticker");
  sel.innerHTML = tickers.map(t => `<option value="${t.symbol}">${t.symbol} · ${t.name}</option>`).join("");
  const reload = () => load(sel.value).catch(e => alert(e.message));
  sel.onchange = reload;
  document.querySelectorAll("input[type=checkbox]").forEach(cb => cb.onchange = reload);
  reload();
})();
</script>
</body>
</html>
